<style>
#app{display:none!important}
#burp{max-width:640px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
#burp .logo{font-size:30px}
#burpBtn{width:190px;height:190px;border-radius:50%;border:2px solid #5C4A22;background:radial-gradient(circle at 35% 30%,#3A3020,#1E1A10 70%);color:var(--gold);font:italic 700 34px "Bodoni 72",Didot,"Playfair Display",Georgia,serif;cursor:pointer;box-shadow:0 0 0 6px #131824,0 0 40px #E7B65C22;transition:transform .12s}
#burpBtn:hover{transform:scale(1.03)}#burpBtn:active{transform:scale(.97)}
#burpBtn[disabled]{opacity:.6;cursor:wait}
#bInfo{color:var(--mu);font-size:15px;min-height:22px}
#bInfo b{color:var(--tx);font-weight:600}
#bParts{width:100%;display:flex;flex-direction:column;gap:8px}
#bParts .pr{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;text-align:left}
#bParts .pr span{color:var(--mu)}
#bDl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
</style>
<div id="burp">
  <header style="width:100%"><div class="logo serif">Divine <i>Burp</i> Machine</div><div class="grow"></div><a class="back" href="/">← all machines</a></header>
  <button id="burpBtn" title="Press for a whole new track">BURP</button>
  <div id="bInfo">One press, one whole track. Never the same twice.</div>
  <div id="bParts" hidden></div>
  <div id="bDl" hidden><button class="btn big" id="bZip">Download all (zip)</button><button class="btn" id="bFull">Full MIDI only</button></div>
  <div class="muted small" id="bNote" hidden>Choose a plugin per part, or leave it plain MIDI. The track stays the same when you switch.</div>
</div>
<script>
(function () {
  ls.set = function () {};   // the Burp Machine never touches what you saved in the Director
  const B = { hist: [], count: 0, plug: { beat: 'gm', bass: 'plain', chords: 'plain', melody: 'plain', answer: 'plain' } };
  try { B.hist = JSON.parse(localStorage.getItem('burp-hist') || '[]'); B.count = +localStorage.getItem('burp-count') || 0; const pl = JSON.parse(localStorage.getItem('burp-plug') || 'null'); if (pl) B.plug = pl; } catch (e) { /* private window */ }
  const keep = () => { try { localStorage.setItem('burp-hist', JSON.stringify(B.hist.slice(-300))); localStorage.setItem('burp-count', String(B.count)); localStorage.setItem('burp-plug', JSON.stringify(B.plug)); } catch (e) { /* private window */ } };
  const PARTS = [['beat', 'Beat'], ['bass', 'Bass'], ['chords', 'Chords'], ['melody', 'Melody'], ['answer', 'Answer']];
  const G = GENRES.map((g) => g[0]), PK = ['melody', 'chords', 'answer', 'bass', 'beat'];
  // everything is open: any genre next to any genre, rules of one place on another, sometimes, never always
  function slotNew(p, r, pick, chance) { const sl = { inst: chance(0.3) ? 'machine' : pick(Object.keys(INST[p])), feel: chance(0.7) ? pick(Object.keys(FEELS)) : '' };
    if (chance(0.35)) sl.src = pick(G);                                                                     // play like another genre
    const rr = r(); if (rr < 0.12) { sl.rh = pick(['every', 'speed', 'slow']); sl.n = pick([1, 2, 3, 4, 5, 7, 8]); }
    else if (rr < 0.2) { sl.rh = 'draw'; sl.ed = { add: [], del: [] }; sl.pat = Array.from({ length: 16 }, (_, i) => (i % 4 === 0 ? r() < 0.7 : r() < 0.22)); }
    else if (rr < 0.32) sl.rhFrom = pick(PK.filter((q) => q !== p));                                        // borrow another place's rhythm
    if (chance(0.33)) sl.sw = pick(['grow', 'fade', 'arc']);
    if (p !== 'beat' && chance(0.25)) sl.shape = pick(['rise', 'fall', 'stay']);
    if (chance(0.15)) sl.in = 1 + 4 * Math.floor(r() * 2);
    return sl; }
  // everything is open, and still one piece: glue in every part, one thread from part to part, a form with a start and an end
  function roll(seed) { const r = E.rng(seed), pick = (a) => a[Math.floor(r() * a.length)], chance = (p) => r() < p;
    const bpm = 70 + Math.floor(r() * 101), key = { root: Math.floor(r() * 12), scale: pick(['minor', 'minor', 'major']) };
    const totalBars = Math.max(48, Math.round((120 + r() * 240) * bpm / 240 / 8) * 8), n = 3 + Math.floor(r() * 6);
    let left = totalBars; const lens = []; for (let i = 0; i < n; i++) { const share = i === n - 1 ? left : Math.max(8, Math.round(left / (n - i) * (0.6 + r() * 0.8) / 8) * 8); lens.push(Math.min(share, left - 8 * (n - i - 1))); left -= lens[i]; }
    if (lens[0] > 16) { lens[1] += lens[0] - 16; lens[0] = 16; }   // the opening is short, so the beat is never far away
    const scenes = []; let prev = null;
    lens.forEach((L, i) => { let sc;
      if (!prev) { sc = { genre: pick(G), slots: {} }; PK.forEach((p) => { sc.slots[p] = {}; }); ['chords', pick(['bass', 'beat'])].forEach((p) => { sc.slots[p] = slotNew(p, r, pick, chance); sc.slots[p].sw = 'grow'; }); }   // the opening: a few places, growing
      else { sc = JSON.parse(JSON.stringify(prev)); if (chance(0.6)) sc.genre = pick(G);                     // the next part inherits, and changes two or three things
        const ch = PK.slice().sort(() => r() - 0.5).slice(0, 2 + Math.floor(r() * 2));
        ch.forEach((p) => { sc.slots[p] = sc.slots[p].inst && p !== 'beat' && chance(0.35) ? {} : slotNew(p, r, pick, chance); }); }   // once the beat is in, it stays (it may change)
      if (!sc.slots.chords.inst) sc.slots.chords = Object.assign(slotNew('chords', r, pick, chance), { inst: pick(['pad', 'strings', 'organ', 'machine']), rh: undefined, rhFrom: undefined });   // glue: always harmony
      if (i >= 1 && !sc.slots.beat.inst) sc.slots.beat = slotNew('beat', r, pick, chance);   // the beat is there by the second part at the latest
      if (sc.slots.answer.inst && !sc.slots.melody.inst) sc.slots.answer = {};                              // an answer needs a melody to answer
      if (!sc.slots.bass.inst && !sc.slots.beat.inst) sc.slots.bass = slotNew('bass', r, pick, chance);   // and always a floor, also at the end
      prev = sc;
      // long parts get a small change every 8 to 16 bars, so nothing stands still
      for (let a0 = 0; a0 < L; ) { const piece = Math.min(L - a0, L - a0 > 24 ? pick([8, 16]) : L - a0), c = JSON.parse(JSON.stringify(sc)); c.seed = Math.floor(r() * 2147483647); c.time = fmt(piece * 240 / bpm); c.cont = a0 > 0; scenes.push(c); a0 += piece; } });
    const end = scenes[scenes.length - 1];   // only the very last stretch thins out and fades, so a long last part keeps its beat
    if (scenes.length > 2) { PK.forEach((p) => { if (end.slots[p].inst && (p === 'melody' || p === 'answer') && chance(0.5)) end.slots[p] = {}; }); ['chords', 'bass', 'beat'].forEach((p) => { if (end.slots[p].inst) end.slots[p].sw = 'fade'; }); }
    if (!end.slots.bass.inst && !end.slots.beat.inst) end.slots.bass = slotNew('bass', r, pick, chance);
    return { scenes, bpm, key }; }
  const print = (t) => t.scenes.map((s) => s.genre).join('>') + '|' + t.key.root + t.key.scale + '|' + Math.round(t.bpm / 6);
  function build(t) { S.scenes = JSON.parse(JSON.stringify(t.scenes)); S.lyrics = ''; S.tempo = 'own'; S.bpm = t.bpm; S.forceKey = t.key; S.seed = t.seed; S.motif = true;
    S.scenes.forEach((sc) => { PK.forEach((p) => { const sl = sc.slots[p]; if (!sl.inst) return; sl.plug = B.plug[p];
      if (sl.pat) { const bars = barsOf(S.scenes.indexOf(sc)); for (let b = 0; b < bars; b++) sl.pat.forEach((on, i) => { if (on) sl.ed.add.push(b * 16 + i); }); delete sl.pat; } }); });
    const R = makeAll(), merged = {};
    R.tracks.forEach((tr) => { const m = merged[tr.part] = merged[tr.part] || { name: PARTS.find((x) => x[0] === tr.part)[1], part: tr.part, notes: [], scenes: new Set() }; m.notes.push(...tr.notes); });
    R.tracks = PARTS.map(([p]) => merged[p]).filter((m) => m && (m.part !== 'answer' || m.notes.length >= R.total / BAR / 2))   // an answer that hardly speaks is left out.map((m) => Object.assign(m, { notes: m.notes.sort((a, b) => a.t - b.t) }));
    R.markers = R.markers.filter((m, i) => !S.scenes[i].cont).map((m, i) => ({ t: m.t, text: 'Part ' + (i + 1) }));
    const sc7 = E.scalePcs(R.key), triad = [0, 2, 4].map((d) => sc7[d]);   // the end: one last chord on the home tone, so it lands
    R.tracks.forEach((tr) => { tr.notes.forEach((x) => { x.v = E.clamp(x.v, 40, 120); });
      if (tr.part === 'bass') tr.notes.push({ t: R.total, d: BAR * 2 - 40, p: 36 + ((R.key.root - 0) % 12 + 12) % 12 - (R.key.root > 7 ? 12 : 0), v: 96 });
      if (tr.part === 'chords') triad.forEach((pc) => tr.notes.push({ t: R.total, d: BAR * 2 - 40, p: 60 + ((pc - 0) % 12 + 12) % 12 - (pc > 7 ? 12 : 0), v: 80 })); });
    R.total += BAR * 2; S.res = R; return R; }
  function show(R) { const secs = Math.round(R.total / BAR * 240 / R.bpm);
    $('#bInfo').innerHTML = '<b>Track ' + String(B.count).padStart(4, '0') + '</b>  ·  ' + fmt(secs) + '  ·  ' + R.bpm + ' bpm';
    const box = $('#bParts'); box.innerHTML = '';
    R.tracks.forEach((t) => { const d = document.createElement('div'); d.className = 'pr'; const l = document.createElement('span'); l.textContent = t.name;
      d.append(l, sel(plugOpts(t.part), B.plug[t.part], (v) => { B.plug[t.part] = v; keep(); build(B.cur); })); box.append(d); });
    $('#bParts').hidden = false; $('#bDl').hidden = false; $('#bNote').hidden = false; }
  $('#burpBtn').onclick = () => { $('#burpBtn').disabled = true;
    setTimeout(() => { let t, tries = 0; do { t = roll(E.newSeed() ^ Date.now()); t.seed = E.newSeed(); tries++; } while (B.hist.includes(print(t)) && tries < 50);   // never a track you already had
      B.hist.push(print(t)); B.count++; B.cur = t; keep(); show(build(t)); $('#burpBtn').disabled = false; }, 30); };
  const name = () => 'DM_Burp_' + String(B.count).padStart(4, '0') + '_' + S.res.bpm + 'bpm_' + E.keyName(S.res.key).replace(/\s/g, '');
  $('#bFull').onclick = () => saveBlob(new Blob([full()], { type: 'audio/midi' }), name() + '_Full.mid');
  $('#bZip').onclick = () => { const files = [{ name: name() + '_Full.mid', data: full() }];
    S.res.tracks.forEach((t, i) => files.push({ name: String(i + 1).padStart(2, '0') + '_' + t.name + (B.plug[t.part] !== 'plain' && B.plug[t.part] !== 'gm' ? '_for_' + safe(E.PLUGINS[B.plug[t.part]].name) : '') + '.mid', data: E.writeMidi([{ name: t.name, channel: t.part === 'beat' ? 9 : 0, notes: t.notes }], { bpm: S.res.bpm, meter: '4/4', title: t.name, markers: S.res.markers }) }));
    saveBlob(zip(files), name() + '.zip'); };
})();
</script>
