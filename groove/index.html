<style>
/* Layout: one instrument panel. Top bar = song settings, left = song spiral, centre = the editor, right = the part slots (one opens at a time), top bar also holds delivery. Dark first, like gear in a dim studio. */
:root{
  --bg:#101219; --panel:#171a24; --raise:#1e2230; --line:#2a2f42; --line2:#3a4058;
  --fg:#ebe8f2; --muted:#9296ad; --faint:#636884;
  --beat:#e8825a; --bass:#9488ec; --chords:#3cbf95; --pad:#5cc3d8; --melody:#ec6aa4; --answer:#e6b450;
  --beat-t:#e8825a26; --bass-t:#9488ec26; --chords-t:#3cbf9526; --pad-t:#5cc3d826; --melody-t:#ec6aa426; --answer-t:#e6b45026;
  --accent:#e8825a; --accent-ink:#1b1608; --ok:#5fd39a; --warn:#f0a35a;
  --intro:#d8b45a; --verse:#9488ec; --chorus:#e8825a; --break:#3cbf95; --build:#ec6aa4; --outro:#8c90a6; --prechorus:#6aa6ec; --drop:#e85a5a; --fill:#a8c95a;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f2f7; --panel:#ffffff; --raise:#eceaf3; --line:#dcd9e6; --line2:#c4c0d4;
  --fg:#1b1a24; --muted:#5e5b72; --faint:#8d8aa2;
  --beat:#c9572c; --bass:#5f50cf; --chords:#16916c; --pad:#1b87a0; --melody:#c63c7e; --answer:#a47410;
  --beat-t:#c9572c1f; --bass-t:#5f50cf1f; --chords-t:#16916c1f; --pad-t:#1b87a01f; --melody-t:#c63c7e1f; --answer-t:#a474101f;
  --accent:#c9572c; --accent-ink:#ffffff; --ok:#1d8a57; --warn:#b4621b;
  --intro:#a8801b; --verse:#5f50cf; --chorus:#c9572c; --break:#16916c; --build:#c63c7e; --outro:#6e6b84; --prechorus:#2f6fbd; --drop:#c22f2f; --fill:#5f8a12;
  color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#f3f2f7; --panel:#ffffff; --raise:#eceaf3; --line:#dcd9e6; --line2:#c4c0d4;
  --fg:#1b1a24; --muted:#5e5b72; --faint:#8d8aa2;
  --beat:#c9572c; --bass:#5f50cf; --chords:#16916c; --pad:#1b87a0; --melody:#c63c7e; --answer:#a47410;
  --beat-t:#c9572c1f; --bass-t:#5f50cf1f; --chords-t:#16916c1f; --pad-t:#1b87a01f; --melody-t:#c63c7e1f; --answer-t:#a474101f;
  --accent:#c9572c; --accent-ink:#ffffff; --ok:#1d8a57; --warn:#b4621b;
  --intro:#a8801b; --verse:#5f50cf; --chorus:#c9572c; --break:#16916c; --build:#c63c7e; --outro:#6e6b84; --prechorus:#2f6fbd; --drop:#c22f2f; --fill:#5f8a12;
  color-scheme:light; }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);margin:0;overflow:hidden}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
button:hover{border-color:var(--line2)}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:disabled{opacity:.45;cursor:default}
select,input[type=number],input[type=text]{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0}
input[type=number]{width:64px;font-variant-numeric:tabular-nums}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px;gap:8px}
.top{display:flex;flex-direction:column;align-items:stretch;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.brand{font:700 17px/1 var(--display);letter-spacing:.01em;white-space:nowrap;margin-right:4px}
.brand b{color:var(--accent);font-weight:700}
.top .grp{display:flex;align-items:center;gap:6px}
.top .trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top .pp{display:flex;background:var(--raise);border-radius:8px;padding:2px}
.top .pp button{border:0;background:transparent;padding:4px 10px;font-size:12px}
.top label{font-size:12px;color:var(--muted)}
.top .sep{width:1px;height:24px;background:var(--line)}
.autotag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;cursor:pointer;user-select:none}
.autotag.on{color:var(--accent);border-color:var(--accent)}
#songName{width:140px;font-family:var(--display);font-weight:500}
.grow{flex:1}

.main{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:8px;min-height:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:0;display:flex;flex-direction:column}
.left{padding:10px;gap:8px;overflow:auto}
.left>*{flex-shrink:0}
.now{text-align:center}
.now .sec{font:700 20px/1.1 var(--display)}
.now .bar{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#spiral{width:100%;max-width:210px;aspect-ratio:1;align-self:center;cursor:pointer;touch-action:none}
.lanes .lrow{display:grid;grid-template-columns:62px 26px 1fr 58px;gap:6px;align-items:center;font-size:12px}
.lanes .lname{color:var(--muted)}
.lanes .lsw{padding:2px 0;font-size:11px;min-height:0}
.lanes .lsw.on{background:var(--beat);color:var(--bg);border-color:var(--beat)}
.lanes .lval{font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.lanes input[type=range]{width:100%;accent-color:var(--beat)}
.ltogs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ltogs button.on{background:var(--fg);color:var(--bg)}
.mixwrap{display:flex;flex-direction:column;gap:8px;width:100%;overflow:auto;padding:4px}
.mixgrid{display:grid;gap:3px;align-items:center}
.mixhead{display:flex;gap:3px;align-items:center}
.mixtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mixmore{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 10px;margin:2px 0 6px;border:1px solid var(--beat);border-radius:10px;background:color-mix(in srgb,var(--beat) 8%,var(--panel))}
.mmrow{display:inline-flex;gap:6px;align-items:center}
.mmamt button{font-size:11.5px;padding:3px 8px}
.mmamt button.on{background:var(--beat);color:var(--bg)}
.mixcell.inrange{box-shadow:inset 0 0 0 2px var(--fg)}
.mixfx{padding:2px 5px;min-height:0;font-size:12px}
.mixfx .ico{width:14px;height:14px}
.mixfx.on{background:var(--beat);color:var(--bg);border-color:var(--beat)}
.mixprog{font-size:11px;padding:2px 2px;width:78px}
.mixhead .mixname{width:60px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.mixgrid .mixname{font-size:12px;padding:3px 6px;text-align:left;justify-content:flex-start}
.mixgrid .mixbar{font-size:10.5px;padding:2px 0;min-height:0}
.mixgrid .mixbar.on{background:var(--fg);color:var(--bg)}
.mixcell{height:26px;min-height:0;padding:0;border-radius:5px;border:1px solid var(--line2)}
.mixcell.plays{background:var(--beat)}
.mixcell.empty{background:transparent}
.mixcell.off{background:var(--raise);background-image:repeating-linear-gradient(45deg,transparent 0 4px,var(--line2) 4px 6px)}
.tappads{display:flex;gap:4px;flex-wrap:wrap;align-items:center;justify-content:center;padding:6px 4px 2px}
.tpad{display:inline-flex;flex-direction:column;align-items:center;gap:1px;padding:4px 8px;min-width:38px;font-size:10px}
.tpad.hit{background:var(--beat);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:4px;position:relative}
.chip.dragging{opacity:.35}
.dragghost{position:fixed;z-index:60;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.35);transform:rotate(-2deg)}
.dropmark{position:absolute;width:3px;border-radius:2px;background:var(--fg);pointer-events:none}
.chip{font-size:12px;border-radius:7px;border:1px solid transparent;background:var(--raise);display:inline-flex;align-items:stretch;font-variant-numeric:tabular-nums;overflow:hidden}
.chip.add{padding:3px 7px;cursor:pointer;align-items:center}
.chipbtn{background:transparent;border:0;border-radius:0;padding:3px 4px 3px 7px;font-size:12px;gap:5px}
.chipx{background:transparent;border:0;border-radius:0;padding:0 6px;font-size:14px;line-height:1;color:var(--muted)}
.chipx:hover{color:var(--fg);background:color-mix(in srgb,var(--fg) 10%,transparent)}
.typegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.typegrid .full{grid-column:1/-1}
.tbtn{font-size:11.5px;padding:5px 4px;justify-content:center;border-left-width:3px}
.scope{display:flex;flex-wrap:wrap;max-width:100%;background:var(--raise);border-radius:8px;padding:2px;gap:2px}
.scope button{border:0;background:transparent;font-size:12px;padding:5px 9px;white-space:nowrap}
.scope button.on{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--accent)}
.editing{font-size:12px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);border-radius:7px;padding:3px 8px;white-space:nowrap}
.genrepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.gcard{flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:12px;text-align:left}
.gcard b{font:700 18px/1.1 var(--display)}
.gcard span{font-size:12px;color:var(--muted)}
.gcard:hover{border-color:var(--accent)}
.stepnum{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ringwrap{display:flex;flex-direction:column;gap:6px;width:100%;height:100%}
.ringwrap>svg{flex:1;min-height:0;width:100%;display:block;touch-action:none;user-select:none}
.bartabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.bartabs.rows4{display:grid;grid-template-columns:repeat(4,auto);justify-content:center}
.bt{font-size:12px;padding:4px 9px;position:relative}
.bt .owndot{position:absolute;top:2px;right:2px;margin:0}
.editscope{display:inline-flex;gap:3px;align-items:center;flex-wrap:wrap;padding:2px 4px;border:1px solid var(--line2);border-radius:10px}
.editscope>.small{padding:0 4px}
.editscope button{font-size:12.5px;padding:5px 9px}
.editscope button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.editscope button:disabled{opacity:.4}
.bt.on{background:var(--fg);color:var(--bg)}
.bt.now{box-shadow:inset 0 -2px 0 var(--accent)}
.suggest{display:grid;gap:8px}
.sgrow{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--raise);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.sgrow>div{min-width:0;flex:1}
.freebox{display:grid;gap:8px;border:1px solid var(--line2);border-radius:12px;padding:12px}
.chip .n{color:var(--muted);font-size:11px}
.chip.sel{border-color:var(--fg)}
.chip.play{box-shadow:inset 0 -2px 0 var(--accent)}
.secedit{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--raise);border-radius:10px;padding:8px}
.secedit .full{grid-column:1/-1}
.secedit button{justify-content:center;padding:5px 6px}
.secedit .sechead{display:flex;align-items:center;gap:8px;font-size:14px}
.secedit .swatch{width:10px;height:10px;border-radius:3px;flex:none}
.secedit .secrow{display:flex;align-items:center;gap:6px}
.secedit .secrow select{flex:1;min-width:0}
.secedit .secrow .small{min-width:34px}
.secedit .barsval{flex:1;text-align:center;font-family:var(--display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.secedit .faint{color:var(--faint)}
.chip.add.sel{border-color:var(--fg)}
.owndot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-left:4px;vertical-align:middle;opacity:.8}
.now{position:relative;padding:0 32px}
.structdice{position:absolute;top:0;right:0}
.secparts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.secparts button{font-size:11.5px;padding:5px 2px}
.cbar.echo{opacity:.55;border-style:dashed}
.manuals{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.manuals>span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.manuals>span svg{width:15px;height:15px}
.mlink{border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--fg);text-decoration:none;background:var(--raise)}
.mlink:hover{border-color:var(--accent)}
.manuals.small .mlink{padding:3px 8px}
.copy{margin-top:8px;color:var(--faint);font-size:11px}
.small{font-size:12px;color:var(--muted)}

.centre{overflow:hidden}
.edhead{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border-radius:8px;padding:5px 10px;font-weight:500}
.tab .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.tab.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.centre{position:relative}
.ripples{position:absolute;pointer-events:none;z-index:0}
.edbody{flex:1;min-height:0;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:8px}
.edbody>svg,.chordwrap>svg.wheel{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.chordwrap>svg.wheel{flex:1;min-height:0}
.chordwrap{display:flex;flex-direction:column;gap:10px;width:100%;height:100%}
.chordbars{display:grid;gap:6px;grid-template-columns:repeat(4,minmax(0,1fr))}
.cbar{border-radius:9px;padding:6px 6px;text-align:center;font:600 16px/1.1 var(--display);border:1px solid var(--line);background:var(--raise);cursor:pointer;min-height:42px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.cbar small{font:400 11px/1 var(--mono);color:var(--muted)}
.cbar.sel{border-color:var(--chords);box-shadow:0 0 0 1px var(--chords)}
.cbar.empty{color:var(--faint);font-weight:400}
.cbar.now{background:var(--chords-t)}
.cbar.shadow{border-style:dashed;border-color:var(--chords)}
.chordtools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.wheel{flex:1;min-height:0}
.hint{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);min-height:40px}
.hint .bulb{color:var(--accent)}
.vfader{position:absolute;z-index:5;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font:12px var(--mono)}
.vfader .track{width:14px;height:110px;border-radius:7px;background:var(--raise);position:relative;cursor:ns-resize;touch-action:none}
.vfader .fill{position:absolute;left:0;right:0;bottom:0;border-radius:7px}

.right{padding:8px;gap:8px;overflow:auto}
.slot{border:1px solid var(--line);border-radius:11px;padding:8px;display:grid;gap:6px;background:var(--panel)}
.slot.selp{box-shadow:0 0 0 1px var(--fg) inset}
.slot .hd{display:flex;align-items:center;gap:7px}
.slot .nm{font:700 15px/1 var(--display);cursor:pointer}
.slot .badge{font-size:11px;border-radius:6px;padding:2px 6px;margin-left:auto;white-space:nowrap}
.slot .hd{cursor:pointer}
.slot .hd .iconbtn{padding:3px 5px}
.slot.closed{gap:5px;padding:6px 8px}
.slot .chev svg{transform:rotate(90deg)}
.slot.open .chev svg{transform:rotate(90deg) scaleX(-1)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--raise);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 0;font-size:12px;justify-content:center;border-radius:6px}
.seg button.on{background:var(--panel);color:var(--fg);border-color:transparent;box-shadow:0 0 0 1px var(--line2)}
.slot .row{display:flex;gap:6px;align-items:center}
.slot select{flex:1;font-size:12px;padding:4px 6px}
.feel{display:flex;align-items:center;gap:8px}
.pad{width:74px;height:40px;border-radius:7px;border:1px solid var(--line2);position:relative;cursor:crosshair;touch-action:none;flex:none;background:linear-gradient(var(--line) 0 0) 50% 0/1px 100% no-repeat,linear-gradient(var(--line) 0 0) 0 50%/100% 1px no-repeat}
.pad i{position:absolute;width:12px;height:12px;border-radius:50%;margin:-6px 0 0 -6px}
.feel .lab{font-size:11px;color:var(--muted);line-height:1.25}
.iconbtn{padding:5px 7px}

.pp button.on{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--line2)}

.overlay{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet.listen .lspiral{width:min(260px,70vw);height:auto}
.bigplay{font-size:18px;padding:12px 34px;border-radius:999px}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:min(980px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font:700 24px/1.1 var(--display);margin:0;text-wrap:balance}
.sheet h3{font:700 15px/1.2 var(--display);margin:0}
.sheet .hdr{display:flex;align-items:center;gap:10px}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.door{flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:12px;text-align:left;min-height:118px}
.door b{font:700 17px/1.1 var(--display)}
.door span{font-size:12px;color:var(--muted)}
.door .ico{width:22px;height:22px}
.door.pick{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.genres{display:flex;gap:8px;flex-wrap:wrap}
.genres button{padding:8px 14px;border-radius:9px}
.genres button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lib{display:grid;gap:6px}
.lrow{display:grid;grid-template-columns:auto 90px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--raise);border-radius:10px;padding:8px 10px}
.lrow .meta{font-size:12px;color:var(--muted)}
.lrow input{width:100%;background:transparent;border:1px solid transparent;font-weight:600;padding:2px 4px}
.lrow input:hover,.lrow input:focus{border-color:var(--line2)}
.lrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dtab{width:100%;border-collapse:collapse;font-size:13px}
.dtab td,.dtab th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.dtab th{font-size:12px;color:var(--muted);font-weight:500}
.dtab .fn{font:12px var(--mono);word-break:break-all}
.scroller{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);border-radius:10px;padding:9px 14px;font-size:13px;display:flex;gap:10px;align-items:center;max-width:min(560px,calc(100% - 32px))}
.toast button{background:transparent;color:var(--bg);border-color:var(--bg);padding:3px 8px}
.dropveil{position:fixed;inset:0;z-index:80;border:3px dashed var(--accent);background:color-mix(in srgb,var(--bg) 70%,transparent);display:flex;align-items:center;justify-content:center;font:700 26px var(--display);pointer-events:none}
.kbd{font:11px var(--mono);border:1px solid var(--line2);border-radius:5px;padding:1px 5px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.zones{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden}
.zones span{font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.pcard{display:flex;gap:8px;align-items:center;font-size:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:1100px){.main{grid-template-columns:200px minmax(0,1fr) 250px}}
@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:1fr}
  .left{flex-direction:row;flex-wrap:wrap;align-items:center}
  #spiral{max-width:150px}
  .left>.chips,.left>.secedit,.left>.typegrid{flex-basis:100%;width:100%;min-width:0}
  .centre{min-height:420px}
  .edbody{height:380px}
  .lrow{grid-template-columns:auto minmax(0,1fr);}
  .lrow .acts{grid-column:1/-1;justify-content:flex-start}
  .lrow svg{display:none}
}
