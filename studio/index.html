  const strip = (p) => { const n = Math.min(tot, PHONE() ? 48 : 96), cells = []; for (let i = 0; i < n; i++) { const b0 = Math.floor(i * tot / n), b1 = Math.max(b0 + 1, Math.floor((i + 1) * tot / n)); let on = false, ed = false; for (let b = b0; b < b1; b++) { if (map[p][b]) on = true; const a2 = D.sectionAt(sg, b); if (a2 && D.barOwnOf(sg, a2.s, p, a2.inBar)) ed = true; } const at = D.sectionAt(sg, b0); cells.push(h('button', { 'data-cell': i, 'aria-label': 'Edit ' + PART_NAMES[p] + ', ' + (at ? secLabel(at.i) + ' bar ' + (at.inBar + 1) : 'bar ' + (b0 + 1)), title: at ? secLabel(at.i) + ', bar ' + (at.inBar + 1) : '', onclick: () => { if (!at) return; st.sec = at.i; st.from = 'get'; openEdit(p, at.inBar); }, style: 'position:relative;flex:1;height:18px;min-width:0;padding:0;border:none;border-radius:2px;cursor:pointer;background:' + (on ? 'var(--' + p + ')' : 'var(--track)') }, ed ? h('span', { 'aria-hidden': 'true', style: 'position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--ink)' }) : null)); } return h('div', { role: 'group', class: 'strip', 'aria-label': PART_NAMES[p] + ' bars', style: 'display:flex;gap:2px;flex:1;min-width:160px' }, cells); };
  const rows = PARTS.map((p) => { const P = sg.parts[p], w = emptyWarning(p), off = P.mode === 'off';
    return h('div', { class: 'part' + (w ? ' alert' : '') },
      h('div', { class: 'prow' }, h('span', { class: 'dot', style: 'background:var(--' + p + ')' }), h('span', { class: 'nm', style: 'flex:0 0 90px' }, PART_NAMES[p]), off ? h('span', { style: 'flex:1;color:var(--faint)' }, 'Off: no file') : strip(p),
        off ? null : pluginSel(p),
        off ? null : h('button', { class: 'ib', 'aria-label': 'Listen to ' + PART_NAMES[p] + ' alone', onclick: () => soloPlay(p) }, AU.playing && st.solo === p ? '■' : '▶'),
        off ? null : h('span', { style: 'display:inline-flex;gap:6px' }, versionsOf(P.plugin, p).map((v) => h('button', { class: 'ib', style: 'font-size:13px', onclick: () => getOne(p, v) }, '⬇ ' + (v || 'MIDI'))))),
      w ? h('div', { class: 'warn' }, h('span', null, w), h('button', { onclick: () => { setMode(p, 'machine'); renderGet(); } }, 'Back to Machine')) : null); });
  const n = deliverList(sg).length + 1;
  wrap.append(h('div', { class: 'card', style: 'width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap' },
      h('button', { class: 'ib', onclick: () => { stopAll(); st.solo = null; st.mode = 'overview'; render(); } }, '← Back'),
      h('div', { style: 'flex:1' }, h('div', { style: 'font-size:22px;font-weight:700' }, 'Get it'), h('div', { style: 'color:var(--soft);font-size:14px' }, D.GENRES[sg.genre].name + ' · ' + sg.bpm + ' bpm · ' + keyName(sg.key) + ' · ' + tot + ' bars')),
      h('button', { class: 'ib', style: 'height:56px;padding:0 22px;font-weight:700', 'aria-label': AU.playing && !st.solo ? 'Stop' : 'Play all parts', onclick: playAll }, AU.playing && !st.solo ? '■ Stop' : '▶ Play all'),
      h('button', { class: 'big', style: 'width:auto;padding:0 26px', onclick: getAll }, '⬇ All ' + n + ' files (one zip)')),
    h('div', { style: 'width:100%;display:flex;flex-direction:column;gap:10px' }, h('div', { class: 'lab', style: 'padding:0 4px' }, 'Your files · the strip shows where each part plays · tap it to edit that bar · ▶ Play all hears everything, ▶ on a part listens alone'), rows),
    h('div', { class: 'card', style: 'width:100%;font-size:13px;color:var(--soft)' }, GROOVE ? 'Plus a Structure file with every section as a marker. Pick your drum plugin and the hits land on the right keys of that plugin.' : 'Plus a Structure file with every section as a marker. Bass, chords and melody come as plain MIDI unless you pick a plugin; then they land on the right keys of that plugin. UJAM plugins with phrases come twice: Player plays its own phrases on your chords, Instrument plays every note as written.'));
}

function render() { grooveOnly(song()); setTimeout(showTip, 0); document.body.classList.toggle('getmode', (st.mode === 'get' || st.mode === 'edit')); renderTop(); renderMenu(); if (!song()) return; if (st.mode === 'edit') { renderEdit(); return; } if (st.mode === 'get') { renderGet(); return; } const w = $('#wrap'); if (!$('#left')) { w.innerHTML = ''; w.append(h('aside', { class: 'left', id: 'left' }), h('main', { class: 'mid', id: 'mid' }), h('aside', { class: 'right', id: 'right' })); } renderLeft(); renderMid(); renderRight(); }


/* ---------- first time tips: one card per screen, once ---------- */
const TIPS = {
  overview: ['Welcome', GROOVE ? ['The machine made a whole beat for you. Press ▶ to hear it.', 'Tap the spiral to switch between the structure and where the beat plays.', 'Machine plays it, DIY lets you shape it, Off keeps it silent.', 'Happy? Next: Get it.'] : ['The machine made a whole song for you. Press ▶ to hear it.', 'Tap the spiral to switch between the structure and where each part plays.', 'Per part: Machine plays it, DIY lets you shape it, Off keeps it silent.', 'Happy? Next: Get it.']],
  edit: ['The workshop', ['Tap the bars you want to change. More than one: they change together.', GROOVE ? 'Tap a step to add or remove a hit. Drag up or down: louder or softer.' : 'Tap a step to add or remove a note. Drag up or down: louder or softer; sideways: longer or shorter.', 'Grey shapes are the machine\'s idea. Back to machine undoes your bars.']],
  get: ['Get it', GROOVE ? ['▶ Play all hears the whole beat.', 'Tap a bar in the strip to fix it in the workshop.', 'Pick your drum plugin, then take all files in one zip.'] : ['▶ Play all hears everything; ▶ on a part listens alone.', 'Tap a bar in a strip to fix it in the workshop.', 'Pick a plugin per part, then take all files in one zip.']]
};
function showTip() {
  const old = $('#tip'); if (old && old.dataset.mode === st.mode) return; if (old) old.remove();
  const t = TIPS[st.mode]; if (!t || !song() || store.get(KP + 'tip-' + st.mode, false) || $('#start')) return;
  store.set(KP + 'tip-' + st.mode, true); const close = () => el.remove();
  const el = h('div', { class: 'tip', id: 'tip', role: 'note', 'data-mode': st.mode }, h('b', null, t[0]), h('ol', null, t[1].map((x) => h('li', null, x))), h('button', { class: 'ib', onclick: close }, 'Got it'));
  document.body.append(el);
}
/* ---------- the start: pick a genre ---------- */
function openStart() {
  closeStart(); const last = store.get(KP + 'session', null);
  document.body.append(h('div', { class: 'start', id: 'start' }, h('div', { class: 'box', role: 'dialog', 'aria-label': 'Pick a genre' },
    h('h1', { style: 'margin:0;font-size:28px' }, APP_NAME),
    h('p', { style: 'margin:6px 0 0;color:var(--soft)' }, GROOVE ? 'Pick a genre. The machine makes a whole beat; you shape it.' : 'Pick a genre. The machine makes a whole song; you shape it.'),
    song() ? h('button', { class: 'ib', style: 'margin-top:12px', onclick: closeStart }, '← Back to my song') : last && last.song ? h('button', { class: 'ib', style: 'margin-top:12px', onclick: () => { st.song = last.song; D.ensureTypes && D.ensureTypes(st.song); st.sec = last.sec || 0; clampSec(); closeStart(); render(); } }, 'Continue where you left off') : null,
    h('div', { class: 'gcards' }, D.GENRE_ALL.map((g) => { const G = D.GENRES[g]; return h('button', { class: 'gc', id: 'g_' + g, onclick: () => makeSong(g) }, G.name, h('small', null, (G.bpm ? G.bpm[0] + ' to ' + G.bpm[1] + ' bpm' : ''))); })))));
}
function closeStart() { const el = $('#start'); if (el) el.remove(); }

document.addEventListener('keydown', (e) => { if (e.target.closest && e.target.closest('input,textarea')) return; if (e.code === 'Space' && song() && !$('#start')) { e.preventDefault(); togglePlay(); } if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); } if (e.key === 'Escape' && st.menu) { st.menu = false; renderMenu(); } });
document.addEventListener('click', (e) => { if (st.menu && !e.target.closest('.menu') && !e.target.closest('[aria-label="Menu"]')) { st.menu = false; renderMenu(); } });
window.DMS = { st, song, makeSong, setMode, playsMap, emptyWarning, startPlay, stopAll, render };
render(); openStart();
})();
</script>
