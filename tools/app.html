<style>

:root[data-theme="dark"]{--bg:#101219;--card:#191B26;--ink:#ECEAF5;--soft:#ABA7BF;--faint:#9692AC;--line:#2C2F40;--mute:#262938;--onink:#14151E;--chip:#2E3144;--track:#232636;--dotc:#454960;--warnbg:#3A2F14;--warnfg:#F2D493;--intro:#6E6A85;--outro:#6E6A85;--fill:#4A4D63}
*{box-sizing:border-box}
html{overflow-x:clip}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer}
select{font-family:inherit;color:var(--ink);background:var(--card);cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #5b4bd6;outline-offset:2px}
.top{height:72px;padding:0 28px;display:flex;align-items:center;gap:20px;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:2}
.logo{font-size:20px;font-weight:700;white-space:nowrap}.logo span{color:var(--accent)}

.step b{width:22px;height:22px;border-radius:50%;border:2px solid #CFCBDD;font-size:12px;display:flex;align-items:center;justify-content:center}
.step.done{background:var(--mute);color:var(--ink)}.step.done b{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.step.on{background:var(--ink);color:var(--onink)}.step.on b{background:var(--onink);border-color:var(--onink);color:var(--ink)}
.step[disabled]{opacity:.5;cursor:default}
.dash{width:20px;height:2px;background:#CFCBDD}
.ib{min-width:44px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib[disabled]{opacity:.4;cursor:default}
.wrap{display:flex;gap:22px;padding:22px 28px;flex-wrap:wrap;position:relative;z-index:1}
.left{width:320px;display:flex;flex-direction:column;gap:16px}
.mid{flex:999 1 480px;min-width:0;background:var(--card);border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;overflow:hidden}
.right{width:400px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:20px;padding:18px}
.lab{font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:999px}
.seg button{height:38px;padding:0 16px;border-radius:999px;border:none;background:transparent;color:var(--soft);font-size:13px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--onink)}
.secs{display:flex;flex-direction:column;gap:6px}
.sec{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);border:none;text-align:left;width:100%}
.sec i{width:8px;height:26px;border-radius:4px;flex:none}.sec span{flex:1;font-size:15px;font-weight:600}.sec small{font-size:13px;color:var(--faint)}
.sec.on{background:color-mix(in srgb,var(--accent) 16%,var(--card));color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent)}.sec.on small{color:var(--soft)}
.part{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.prow .dot{width:12px;height:12px;border-radius:50%;flex:none}.prow .nm{flex:1;font-weight:600}
.mode{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.mode button{height:34px;padding:0 10px;border:none;border-radius:8px;background:transparent;font-size:13px;color:var(--soft)}
.mode button.on{background:var(--chip);font-weight:700;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.warn{display:flex;align-items:center;gap:10px;background:var(--warnbg);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--warnfg)}
.warn span{flex:1}.warn button{height:32px;padding:0 10px;border-radius:8px;border:none;background:var(--warnfg);color:var(--warnbg);font-size:12px;font-weight:600}
.part.alert{outline:2px solid var(--answer)}
.play{width:64px;height:64px;border-radius:50%;border:none;background:var(--ink);color:var(--onink);font-size:22px}
.big{height:60px;border-radius:18px;border:none;background:var(--accent);color:#fff;font-size:17px;font-weight:700;width:100%}
.big[disabled]{opacity:.55;cursor:default}
body.getmode .part,body.getmode .card,body.getmode .mid{background:color-mix(in srgb,var(--card) 18%,transparent);box-shadow:inset 0 0 0 1px var(--line)}
canvas.rip{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;min-height:420px;width:100%}
.hint{font-size:14px;color:var(--soft);text-align:center;min-height:20px}
.menu{position:absolute;right:28px;top:66px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;min-width:240px;z-index:20;box-shadow:0 12px 32px rgba(30,29,43,.14)}
.menu a,.menu button{display:block;text-align:left;padding:12px 14px;border-radius:10px;border:none;background:transparent;font-size:15px;color:var(--ink);text-decoration:none}
.menu a:hover,.menu button:hover{background:var(--bg)}
.start{position:fixed;inset:0;background:rgba(30,29,43,.35);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:30}
.start .box{background:var(--card);border-radius:24px;padding:28px;max-width:980px;width:100%}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.gc{text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-size:16px;font-weight:700}
.gc small{display:block;font-weight:500;font-size:13px;color:var(--soft);margin-top:4px}
.gc:hover{border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--onink);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-size:14px;z-index:40;max-width:92vw}
.toast button{border:none;background:var(--onink);color:var(--ink);border-radius:8px;height:32px;padding:0 10px;font-weight:700}
.spin{cursor:pointer;border:none;background:transparent;padding:0}
foot{display:block}
.foot{padding:4px 28px 24px;font-size:12px;color:var(--faint);display:flex;gap:14px;flex-wrap:wrap}
.foot a{color:var(--faint)}

.gsel{margin-top:6px;position:relative;display:inline-block}.gsel select{field-sizing:content;appearance:none;-webkit-appearance:none;border:1px solid transparent;background:transparent;font-size:22px;font-weight:700;padding:2px 30px 2px 12px;border-radius:12px;text-align:center}.gsel select:hover,.gsel select:focus{border-color:var(--line);background:var(--bg)}.gsel::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--soft);pointer-events:none}.gsel option{font-size:15px;font-weight:500}
.secs{position:relative}.sec .grip{cursor:grab;touch-action:none;user-select:none;color:var(--faint);font-size:16px;padding:4px 2px;margin:-4px 0;flex:none}.sec.dragging{position:relative;z-index:5;opacity:.85;box-shadow:0 8px 24px rgba(0,0,0,.4)}.dropmark{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:var(--accent);pointer-events:none}div.sec{cursor:pointer}.sec.on{flex-wrap:wrap;cursor:default}.sec.on .stype{flex:1;min-width:0;font:600 15px Inter,system-ui,sans-serif;border:1px solid transparent;border-radius:8px;padding:3px 6px;background:transparent;color:var(--ink)}.sec.on .stype:hover,.sec.on .stype:focus{border-color:currentColor}.sec.on .stype option{color:var(--ink);background:var(--card)}.sec.on .del{width:30px;height:30px;border:none;border-radius:8px;background:transparent;cursor:pointer;font-size:15px;padding:0}.sec.on .del:disabled{opacity:.3}.sec.on .bctl{flex:0 0 100%;justify-content:flex-end;margin-top:6px}.addsec{height:40px;font-size:14px;margin-top:4px;border-style:dashed}
.sec .bctl{flex:none;display:inline-flex;align-items:center;gap:6px;margin-left:auto}.bctl button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;line-height:1;cursor:pointer;padding:0}.bctl button:disabled{opacity:.35;cursor:default}.bctl small{min-width:54px;text-align:center}
@media (max-width:600px){.stage{min-height:300px}.prow .strip{order:9;flex:0 0 100%!important}.prow .strip button{height:28px!important}.tip{left:12px!important;right:12px!important;bottom:12px!important;width:auto!important}}
.tip{position:fixed;left:20px;bottom:20px;width:340px;z-index:50;background:var(--card);color:var(--ink);border:1px solid var(--line, var(--track));border-radius:18px;padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.35);font-size:14px;line-height:1.45}
.tip b{display:block;font-size:15px;margin-bottom:6px}.tip ol{margin:0 0 12px;padding-left:20px}.tip li{margin:3px 0}
@media (max-width:900px){.top{height:auto;padding:12px 16px;flex-wrap:wrap}.wrap{padding:16px}.left,.right{width:100%}.steps{order:3;flex:0 0 100%;width:100%;justify-content:flex-start;flex-wrap:wrap}}

<script>
/* Divine Music Studio: one path from genre to MIDI. The engine is the suite's own; this is a new face for it. */
(function () {
const D = window.DMM;
const VERSION = '__VERSION__';
const GROOVE = !!window.DMS_GROOVE;
const APP_NAME = 'Divine ' + (GROOVE ? 'Groove' : 'Music') + ' Studio' + (window.DMS_UJAM ? ' UJAM' : '');
const SUITE = window.DMS_UJAM ? 'https://divineacidmonday.github.io/ujam/' : 'https://divineacidmonday.github.io/';
const ALL_PARTS = ['beat', 'bass', 'chords', 'pad', 'melody', 'answer'];
const PARTS = GROOVE ? ['beat'] : ALL_PARTS;
function grooveOnly(sg) { if (GROOVE && sg) for (const p of ALL_PARTS) if (p !== 'beat') sg.parts[p].mode = 'off'; }
const PART_NAMES = { beat: 'Beat', bass: 'Bass', chords: 'Chords', pad: 'Pad', melody: 'Melody', answer: 'Answer' };
const VARIATION = { calm: 0, gentle: 0.35, wild: 0.75 };
const $ = (s) => document.querySelector(s);
const h = (tag, attrs, ...kids) => { const el = document.createElement(tag); if (attrs) for (const k in attrs) { const v = attrs[k]; if (v == null || v === false) continue; if (k === 'class') el.className = v; else if (k === 'style') el.style.cssText = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (v === true) el.setAttribute(k, ''); else el.setAttribute(k, v); } for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c)); return el; };
const NS = 'http://www.w3.org/2000/svg';
const s = (tag, attrs) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
const cssv = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* fine */ } } };
const PHONE = () => window.innerWidth < 600;
const KP = (window.DMS_UJAM ? 'dmsu-' : 'dms-') + (GROOVE ? 'g-' : '');

function count(ev) { try { if (!/\.github\.io$/.test(location.hostname)) return; const q = new URLSearchParams({ p: ev ? (GROOVE ? 'groove-studio/' : 'studio/') + ev : location.pathname, t: ev || document.title, s: screen.width + ',' + screen.height, rnd: Math.random().toString(36).slice(2) }); if (ev) q.set('e', 'true'); const u = 'https://divine-monday.goatcounter.com/count?' + q; if (!(navigator.sendBeacon && navigator.sendBeacon(u))) new Image().src = u; } catch (e) { /* never in the way */ } }
setTimeout(() => count(), 0);
function feedbackHref() { const sb = 'Feedback / contact: ' + APP_NAME + ' (version ' + VERSION + ')'; const b = 'Hi Divine Monday,\n\nWhat I made:\n\nWhat I liked:\n\nWhat could be better:\n\nMy device and browser: ' + navigator.userAgent.replace(/\s+/g, ' ').slice(0, 160) + '\n'; const to = ['divinemonday', 'feedback'].join('+') + String.fromCharCode(64) + ['gmail', 'com'].join('.'); return 'mail' + 'to:' + to + '?subject=' + encodeURIComponent(sb) + '&body=' + encodeURIComponent(b); }

function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); store.set(KP + 'theme', t); }
applyTheme(store.get(KP + 'theme', 'dark'));
const st = { mode: 'overview', ePart: 'beat', eBar: 0, sel: [0], song: null, sec: 0, view: store.get(KP + 'view', 'drops'), spiral: 'structure', hist: [], fut: [], menu: false, plays: null, playsKey: '' };
const song = () => st.song;

/* ---------- history: every change can be undone ---------- */
function snapshot() { return JSON.stringify(st.song); }
function change(fn) { st.hist.push(snapshot()); if (st.hist.length > 60) st.hist.shift(); st.fut = []; fn(); save(); render(); }
function undo() { if (!st.hist.length) return; st.fut.push(snapshot()); st.song = JSON.parse(st.hist.pop()); D.ensureTypes && D.ensureTypes(st.song); clampSec(); save(); render(); }
function redo() { if (!st.fut.length) return; st.hist.push(snapshot()); st.song = JSON.parse(st.fut.pop()); D.ensureTypes && D.ensureTypes(st.song); clampSec(); save(); render(); }
function save() { store.set(KP + 'session', { song: st.song, sec: st.sec }); }
function clampSec() { st.sec = D.clamp(st.sec, 0, Math.max(0, song().sections.length - 1)); }
let toastT = 0;
function toast(msg, act) { const old = $('.toast'); if (old) old.remove(); clearTimeout(toastT); const t = h('div', { class: 'toast', role: 'status' }, h('span', null, msg), act ? h('button', { onclick: () => { t.remove(); act.fn(); } }, act.label) : null); document.body.append(t); toastT = setTimeout(() => t.remove(), 5000); }

/* ---------- making a song ---------- */
function makeSong(genre) {
  stopAll();
  const sg = D.freshSong(genre, { name: 'Untitled' });
  sg.raw = VARIATION.gentle; sg.studioVar = 'gentle'; for (const p of PARTS) { const k = store.get(KP + 'plug-' + p, null); if (k && D.pluginsFor(p).includes(k)) sg.parts[p].plugin = k; }
  st.song = sg; st.hist = []; st.fut = []; st.sec = Math.max(0, sg.sections.findIndex((x) => x.type === 'verse' || x.type === 'chorus' || x.type === 'drop'));
  count('new/' + genre); save(); closeStart(); render();
}
function newSongSame() { const sg = song(); const parts = PARTS.filter((p) => sg.parts[p].mode === 'machine'); if (!parts.length) { toast('Every part is DIY or off, so the dice leave them as they are.'); return; } change(() => { for (const p of parts) sg.parts[p].seed = D.newSeed(); }); toast('New ideas for every Machine part. DIY parts stayed.', { label: 'Undo', fn: undo }); }
function newStructure() { change(() => { song().sections = D.randomStructure(song(), D.newSeed()); st.sec = 0; }); toast('New structure: ' + song().sections.length + ' sections, ' + D.totalBars(song()) + ' bars.', { label: 'Undo', fn: undo }); }
function newPart(p) { if (song().parts[p].mode !== 'machine') { toast(PART_NAMES[p] + ' is ' + (song().parts[p].mode === 'off' ? 'off' : 'DIY') + '; the dice only change Machine parts.'); return; } change(() => { song().parts[p].seed = D.newSeed(); }); toast('A new ' + PART_NAMES[p].toLowerCase() + ' idea.', { label: 'Undo', fn: undo }); }
function setMode(p, m) {
  const sg = song(), P = sg.parts[p]; if (P.mode === m) return;
  change(() => {
    if (m === 'yours') { // DIY starts from what the machine played, so nothing goes silent
      const wasOff = P.mode === 'off', types = [...new Set(sg.sections.map((x) => x.type))], keep = {};
      for (const ty of types) { const r = D.resolveType(sg, ty)[p]; keep[ty] = r ? D.clone(r) : D.emptyMat(p, sg); }
      P.mode = 'yours';
      for (const ty of types) if (!(sg.mat[ty] && sg.mat[ty][p] && sg.mat[ty][p].src === 'user')) { D.setUser(sg, p, ty, wasOff ? D.emptyMat(p, sg) : keep[ty]); if (!wasOff) sg.mat[ty][p].auto = true; }
    } else P.mode = m;
  });
  if (m === 'yours') toast(PART_NAMES[p] + ' is DIY now and sounds the same. Edit it in the Edit screen.');
}
function setVariation(v) { change(() => { song().raw = VARIATION[v]; song().studioVar = v; }); }

/* ---------- what plays where: one look per bar ---------- */
function playsMap() {
  const sg = song(), key = JSON.stringify([sg.sections, sg.parts, sg.mat, sg.raw, sg.seed]);
  if (st.playsKey === key && st.plays) return st.plays;
  const BT = D.barTicks(sg), tot = D.totalBars(sg), map = {};
  for (const p of PARTS) { const on = new Array(tot).fill(false); if (sg.parts[p].mode !== 'off') { try { D.renderSong(sg, p).forEach((n) => { const b = Math.floor(Math.max(0, n.t) / BT); if (b < tot) on[b] = true; }); } catch (e) { console.error(e); } } map[p] = on; }
  st.plays = map; st.playsKey = key; return map;
}
function emptyWarning(p) {
  const sg = song(); if (sg.parts[p].mode === 'off') return null;
  const on = playsMap()[p]; let b0 = 0, silent = 0; const n = sg.sections.length;
  sg.sections.forEach((x) => { let any = false; for (let b = b0; b < b0 + x.bars; b++) if (on[b]) any = true; if (!any && x.type !== 'fill') silent++; b0 += x.bars; });
  if (sg.parts[p].mode === 'yours' && silent >= Math.max(2, Math.ceil(n / 2))) return 'DIY, and silent in ' + silent + ' of ' + n + ' sections.';
  if (on.every((x) => !x)) return 'Plays nowhere in this song.';
  return null;
}

/* ---------- audio: the suite's sketch sounds ---------- */
const AU = { ctx: null, playing: false, timer: null, queue: [], nextBar: 0, nextT: 0, curBar: 0, curFrac: 0, nodes: [], raf: 0 };
function ensureAudio() { if (AU.ctx) return AU.ctx; const C = window.AudioContext || window.webkitAudioContext; if (!C) { toast('This browser has no audio playback.'); return null; } const ctx = new C(); AU.ctx = ctx; const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3; comp.connect(ctx.destination); const master = ctx.createGain(); master.gain.value = 0.8; master.connect(comp); AU.master = master; const len = ctx.sampleRate * 1.5, nb = ctx.createBuffer(1, len, ctx.sampleRate), d = nb.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; AU.noise = nb; return ctx; }
const mtof = (p) => 440 * Math.pow(2, (p - 69) / 12);
function env(g, t, a, peak, dur, rel) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.setTargetAtTime(0.0001, t + Math.max(a, dur), rel); }
function track(node, end) { AU.nodes.push({ node, end }); }
function noiseSrc(t, dur) { const src = AU.ctx.createBufferSource(); src.buffer = AU.noise; src.start(t, Math.random() * 0.5); src.stop(t + dur); track(src, t + dur); return src; }

function deliverList(sg) { const out = []; for (const p of PARTS) { if (sg.parts[p].mode === 'off' || !playsMap()[p].some(Boolean)) continue; for (const v of versionsOf(sg.parts[p].plugin, p)) out.push({ part: p, ver: v }); } return out; }
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

async function saveFiles(files) { for (let i = 0; i < files.length; i++) { const f = files[i], blob = new Blob([f.data], { type: /\.zip$/.test(f.name) ? 'application/zip' : /\.json$/.test(f.name) ? 'application/json' : 'audio/midi' }), url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = f.name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); if (i < files.length - 1) await new Promise((r) => setTimeout(r, 450)); } toast(files.length === 1 ? 'Downloaded ' + files[0].name : 'Downloaded ' + files.length + ' files'); }

        off ? null : pluginSel(p),
        off ? null : h('button', { class: 'ib', 'aria-label': 'Listen to ' + PART_NAMES[p] + ' alone', onclick: () => soloPlay(p) }, AU.playing && st.solo === p ? '■' : '▶'),
