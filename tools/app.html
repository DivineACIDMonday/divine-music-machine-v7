<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Divine Music Studio</title>
<meta name="description" content="Pick a genre, shape your song, get it as MIDI. Free, mechanical, right in your browser. By Divine Monday.">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F3F8;--card:#fff;--ink:#1E1D2B;--soft:#5E5A72;--faint:#6B6780;--line:#E4E2EC;--mute:#EDEBF5;--accent:#E8836B;
--beat:#E8836B;--bass:#8E7CF0;--chords:#4FB7A3;--pad:#6FA8DC;--melody:#E07BB0;--answer:#E2B04A;
--onink:#fff;--chip:#fff;--track:#F1EFF7;--dotc:#CFCBDD;--warnbg:#FBF3E1;--warnfg:#6A4A06;--l0:#E8836B;--l1:#F0A27A;--l2:#E2B04A;--l3:#E07BB0;--l4:#4FB7A3;--l5:#6FA8DC;--l6:#8E7CF0;--l7:#B7B1D6;--intro:#B9B4CC;--verse:#8E7CF0;--prechorus:#A99BF5;--chorus:#E8836B;--drop:#E8836B;--break:#6FA8DC;--build:#E2B04A;--fill:#CFCBDD;--outro:#B9B4CC}
:root[data-theme="dark"]{--bg:#101219;--card:#191B26;--ink:#ECEAF5;--soft:#ABA7BF;--faint:#9692AC;--line:#2C2F40;--mute:#262938;--onink:#14151E;--chip:#2E3144;--track:#232636;--dotc:#454960;--warnbg:#3A2F14;--warnfg:#F2D493;--intro:#6E6A85;--outro:#6E6A85;--fill:#4A4D63}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #5b4bd6;outline-offset:2px}
.top{height:72px;padding:0 28px;display:flex;align-items:center;gap:20px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-size:20px;font-weight:700;white-space:nowrap}.logo span{color:var(--accent)}
.steps{display:flex;align-items:center;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:none;background:transparent;font-size:14px;font-weight:600;color:var(--soft)}
.step b{width:22px;height:22px;border-radius:50%;border:2px solid #CFCBDD;font-size:12px;display:flex;align-items:center;justify-content:center}
.step.done{background:var(--mute);color:var(--ink)}.step.done b{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.step.on{background:var(--ink);color:var(--onink)}.step.on b{background:var(--onink);border-color:var(--onink);color:var(--ink)}
.step[disabled]{opacity:.5;cursor:default}
.dash{width:20px;height:2px;background:#CFCBDD}
.ib{min-width:44px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib[disabled]{opacity:.4;cursor:default}
.wrap{display:flex;gap:22px;padding:22px 28px;flex-wrap:wrap}
.left{width:320px;display:flex;flex-direction:column;gap:16px}
.mid{flex:999 1 480px;min-width:0;background:var(--card);border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;overflow:hidden}
.right{width:400px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:20px;padding:18px}
.lab{font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:999px}
.seg button{height:38px;padding:0 16px;border-radius:999px;border:none;background:transparent;color:var(--soft);font-size:13px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--onink)}
.secs{display:flex;flex-direction:column;gap:6px}
.sec{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);border:none;text-align:left;width:100%}
.sec i{width:8px;height:26px;border-radius:4px;flex:none}.sec span{flex:1;font-size:15px;font-weight:600}.sec small{font-size:13px;color:var(--faint)}
.sec.on{background:var(--ink);color:var(--onink)}.sec.on small{color:var(--onink);opacity:.7}
.part{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.prow .dot{width:12px;height:12px;border-radius:50%;flex:none}.prow .nm{flex:1;font-weight:600}
.mode{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.mode button{height:34px;padding:0 10px;border:none;border-radius:8px;background:transparent;font-size:13px;color:var(--soft)}
.mode button.on{background:var(--chip);font-weight:700;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.warn{display:flex;align-items:center;gap:10px;background:var(--warnbg);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--warnfg)}
.warn span{flex:1}.warn button{height:32px;padding:0 10px;border-radius:8px;border:none;background:var(--warnfg);color:var(--warnbg);font-size:12px;font-weight:600}
.part.alert{outline:2px solid var(--answer)}
.play{width:64px;height:64px;border-radius:50%;border:none;background:var(--ink);color:var(--onink);font-size:22px}
.big{height:60px;border-radius:18px;border:none;background:var(--accent);color:#fff;font-size:17px;font-weight:700;width:100%}
.big[disabled]{opacity:.55;cursor:default}
canvas.rip{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;min-height:420px;width:100%}
.hint{font-size:14px;color:var(--soft);text-align:center;min-height:20px}
.menu{position:absolute;right:28px;top:66px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;min-width:240px;z-index:20;box-shadow:0 12px 32px rgba(30,29,43,.14)}
.menu a,.menu button{display:block;text-align:left;padding:12px 14px;border-radius:10px;border:none;background:transparent;font-size:15px;color:var(--ink);text-decoration:none}
.menu a:hover,.menu button:hover{background:var(--bg)}
.start{position:fixed;inset:0;background:rgba(30,29,43,.35);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:30}
.start .box{background:var(--card);border-radius:24px;padding:28px;max-width:980px;width:100%}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.gc{text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-size:16px;font-weight:700}
.gc small{display:block;font-weight:500;font-size:13px;color:var(--soft);margin-top:4px}
.gc:hover{border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--onink);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-size:14px;z-index:40;max-width:92vw}
.toast button{border:none;background:var(--onink);color:var(--ink);border-radius:8px;height:32px;padding:0 10px;font-weight:700}
.spin{cursor:pointer;border:none;background:transparent;padding:0}
foot{display:block}
.foot{padding:4px 28px 24px;font-size:12px;color:var(--faint);display:flex;gap:14px;flex-wrap:wrap}
.foot a{color:var(--faint)}
@media (max-width:900px){.top{height:auto;padding:12px 16px;flex-wrap:wrap}.wrap{padding:16px}.left,.right{width:100%}.steps{order:3;width:100%;justify-content:flex-start}}
</style></head><body>
<header class="top" id="top"></header>
<div class="wrap" id="wrap"><aside class="left" id="left"></aside><main class="mid" id="mid"></main><aside class="right" id="right"></aside></div>

<script>

const song = () => st.song;

/* ---------- history: every change can be undone ---------- */
function snapshot() { return JSON.stringify(st.song); }
function change(fn) { st.hist.push(snapshot()); if (st.hist.length > 60) st.hist.shift(); st.fut = []; fn(); save(); render(); }

function save() { store.set(KP + 'session', { song: st.song, sec: st.sec }); }

let toastT = 0;

/* ---------- making a song ---------- */
function makeSong(genre) {
  stopAll();
  const sg = D.freshSong(genre, { name: 'Untitled' });
  sg.raw = VARIATION.gentle; sg.studioVar = 'gentle';
  st.song = sg; st.hist = []; st.fut = []; st.sec = Math.max(0, sg.sections.findIndex((x) => x.type === 'verse' || x.type === 'chorus' || x.type === 'drop'));
  count('new/' + genre); save(); closeStart(); render();
}
function newSongSame() { const sg = song(); const parts = PARTS.filter((p) => sg.parts[p].mode === 'machine'); if (!parts.length) { toast('Every part is DIY or off, so the dice leave them as they are.'); return; } change(() => { for (const p of parts) sg.parts[p].seed = D.newSeed(); }); toast('New ideas for every Machine part. DIY parts stayed.', { label: 'Undo', fn: undo }); }
function newStructure() { change(() => { song().sections = D.randomStructure(song(), D.newSeed()); st.sec = 0; }); toast('New structure: ' + song().sections.length + ' sections, ' + D.totalBars(song()) + ' bars.', { label: 'Undo', fn: undo }); }
function newPart(p) { if (song().parts[p].mode !== 'machine') { toast(PART_NAMES[p] + ' is ' + (song().parts[p].mode === 'off' ? 'off' : 'DIY') + '; the dice only change Machine parts.'); return; } change(() => { song().parts[p].seed = D.newSeed(); }); toast('A new ' + PART_NAMES[p].toLowerCase() + ' idea.', { label: 'Undo', fn: undo }); }

      for (const ty of types) if (!(sg.mat[ty] && sg.mat[ty][p] && sg.mat[ty][p].src === 'user')) { D.setUser(sg, p, ty, wasOff ? D.emptyMat(p, sg) : keep[ty]); if (!wasOff) sg.mat[ty][p].auto = true; }

}
function setVariation(v) { change(() => { song().raw = VARIATION[v]; song().studioVar = v; }); }

/* ---------- what plays where: one look per bar ---------- */
function playsMap() {
  const sg = song(), key = JSON.stringify([sg.sections, sg.parts, sg.mat, sg.raw, sg.seed]);
  if (st.playsKey === key && st.plays) return st.plays;

}
function emptyWarning(p) {
  const sg = song(); if (sg.parts[p].mode === 'off') return null;
  const on = playsMap()[p]; let b0 = 0, silent = 0; const n = sg.sections.length;
  sg.sections.forEach((x) => { let any = false; for (let b = b0; b < b0 + x.bars; b++) if (on[b]) any = true; if (!any && x.type !== 'fill') silent++; b0 += x.bars; });
  if (sg.parts[p].mode === 'yours' && silent >= Math.max(2, Math.ceil(n / 2))) return 'DIY, and silent in ' + silent + ' of ' + n + ' sections.';
  if (on.every((x) => !x)) return 'Plays nowhere in this song.';
  return null;
}

/* ---------- audio: the suite's sketch sounds ---------- */
const AU = { ctx: null, playing: false, timer: null, queue: [], nextBar: 0, nextT: 0, curBar: 0, curFrac: 0, nodes: [], raf: 0 };
function ensureAudio() { if (AU.ctx) return AU.ctx; const C = window.AudioContext || window.webkitAudioContext; if (!C) { toast('This browser has no audio playback.'); return null; } const ctx = new C(); AU.ctx = ctx; const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3; comp.connect(ctx.destination); const master = ctx.createGain(); master.gain.value = 0.8; master.connect(comp); AU.master = master; const len = ctx.sampleRate * 1.5, nb = ctx.createBuffer(1, len, ctx.sampleRate), d = nb.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; AU.noise = nb; return ctx; }

function env(g, t, a, peak, dur, rel) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.setTargetAtTime(0.0001, t + Math.max(a, dur), rel); }

  else if (li === 6) { const o = ctx.createOscillator(); o.type = 'square'; o.frequency.setValueAtTime(820, t); const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; o.connect(bp); bp.connect(g); env(g, t, 0.001, amp * 0.2, 0.01, 0.03); o.start(t); o.stop(t + 0.2); track(o, t + 0.2); }
  else { const n = noiseSrc(t, 1.6), hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4500; n.connect(hp); hp.connect(g); env(g, t, 0.002, amp * 0.3, 0.05, 0.45); }
}
function tone(part, p, t, dur, v) {

      h('button', { class: 'ib', onclick: copyNext }, 'Copy to next →'), h('button', { class: 'ib', onclick: newIdeaBars }, '⚄ New idea'), h('button', { class: 'ib', onclick: backToMachine, disabled: !st.sel.some(edited) || null }, 'Back to machine')),
